<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="220" fill="#0a0510"/>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1a1425" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cf59e6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#cf59e6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="220" fill="url(#grid)"/>
  <circle cx="740" cy="90" r="150" fill="url(#glow)"/>

  <text x="60" y="80" font-family="Fira Code, Consolas, monospace" font-size="22" fill="#ffffff">Namaste(); I'm</text>
  <text x="60" y="132" font-family="Fira Code, Consolas, monospace" font-size="46" font-weight="bold" fill="#cf59e6">LegacyHeaven.</text>
  <text x="60" y="172" font-family="Fira Code, Consolas, monospace" font-size="26" font-weight="bold" fill="#ffffff">I build &amp; break things.</text>
</svg>
